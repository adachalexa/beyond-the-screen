<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Beyond the Screen: five pre-production marketing rules shown on six film campaigns. SMACC Fall 2026 research, University of Connecticut.">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Beyond the Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
/* Layout: one cinematic dark page, hash-routed. Rules and films each open into four tabs with pager buttons. Single dark look by design. */
:root{
  --ink:#0D0A09; --ink-2:#1A1210; --ink-3:#241915; --line:#2E211C; --line-2:#3D2C25; --line-3:#5A4036;
  --chalk:#F4EBDC; --chalk-2:#DCCFBC; --mute:#B3A58F; --dim:#9A8B78;
  --gold:#E9B949; --gold-hi:#F7D27C; --red:#E4544B; --red-hi:#F08A83; --ok:#7FC08A; --brown:#6B4F3E; --glow:rgba(233,185,73,.42);
  --head:'Oswald','Arial Narrow',Impact,sans-serif; --body:'Inter',system-ui,-apple-system,sans-serif; --serif:'Playfair Display',Georgia,serif;
  --max:1200px; --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--ink);color:var(--chalk);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--head);text-transform:uppercase;font-weight:700;letter-spacing:.01em;line-height:1.02;text-wrap:balance}
h3{font-size:22px}
.kicker{font:700 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:10px}
.kicker:before{content:"";width:18px;height:2px;background:var(--gold)}
.lede{font-size:clamp(18px,2vw,20px);color:var(--chalk-2);max-width:68ch}
.small{font-size:14px;color:var(--mute)}
.gold{color:var(--gold)} .redc{color:var(--red)}

/* top nav */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 19px/1 var(--head);letter-spacing:.05em;text-transform:uppercase}
.brand .dot{width:12px;height:12px;border-radius:3px;background:var(--gold);box-shadow:8px 8px 0 -2px var(--red)}
.links{display:flex;gap:2px;flex-wrap:wrap}
.links a{font:600 13px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;padding:11px 12px;border-radius:999px;color:var(--chalk-2)}
.links a:hover{color:var(--chalk);background:var(--ink-3)}
.links a.on{color:var(--ink);background:var(--chalk)}
.menu-btn{display:none;font:700 13px var(--body);letter-spacing:.08em;border:1px solid var(--line-3);border-radius:999px;padding:10px 16px;text-transform:uppercase}
@media(max-width:900px){
  .menu-btn{display:block}
  .links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--ink);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
  .links.open{display:flex}
}

/* page frame */
.pagebody{padding-block:28px 8px}
.crumbs{font-size:13px;color:var(--mute);padding-top:22px}
.crumbs a{color:var(--chalk-2)}
.ph{font-size:clamp(40px,6.4vw,84px);margin:12px 0 18px}
.page{animation:fade .35s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:18px}
.facts div{padding:12px 16px 12px 0;min-width:0}
.facts b{display:block;font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.facts span{font:600 15px var(--body)}
@media(max-width:720px){.facts{grid-template-columns:1fr 1fr}}

/* buttons */
.cta{display:inline-flex;align-items:center;gap:12px;background:var(--chalk);color:var(--ink);font:700 14px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:16px 22px;text-decoration:none;border:2px solid var(--chalk);border-radius:999px;transition:background .2s,border-color .2s}
.cta:hover{background:var(--gold);border-color:var(--gold)}
.cta.ghost{background:none;color:var(--chalk);border-color:var(--line-3)}
.cta.ghost:hover{border-color:var(--gold);color:var(--gold)}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}

/* tabs + pager */
.tabs{display:flex;border:1px solid var(--line-2);border-radius:var(--r);margin:6px 0 30px;overflow-x:auto;background:var(--ink-2)}
.tabs a{flex:1;min-width:150px;padding:15px 16px;text-decoration:none;font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;border-right:1px solid var(--line-2);color:var(--chalk-2);display:flex;gap:10px;align-items:center;white-space:nowrap}
.tabs a:last-child{border-right:0}
.tabs a span{color:var(--dim);font-family:var(--head);font-size:16px}
.tabs a:hover{background:var(--ink-3);color:var(--chalk)}
.tabs a.on{background:var(--chalk);color:var(--ink)}
.tabs a.on span{color:var(--brown)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:40px 0 12px}
.pager a{border:1px solid var(--line-2);border-radius:var(--r);padding:20px 22px;text-decoration:none;display:block;background:var(--ink-2);transition:background .2s,border-color .2s}
.pager a:hover{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.pager a:hover small{color:var(--brown)}
.pager small{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.pager span{display:block;font:700 22px/1.15 var(--head);text-transform:uppercase;margin-top:6px}
.pager .nx{text-align:right}
.pager .empty{border:0;background:none}
@media(max-width:600px){.pager{grid-template-columns:1fr}.pager .nx{text-align:left}}

/* nav tiles (home) */
.navtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0 40px}
.navtiles a{padding:22px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--ink-2);text-decoration:none;display:flex;flex-direction:column;gap:8px;min-height:200px;transition:background .2s,border-color .2s}
.navtiles a:hover{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.navtiles a:hover p,.navtiles a:hover small{color:var(--brown)}
.navtiles small{font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.navtiles p{font-size:14.5px;color:var(--chalk-2)}
.navtiles .go{margin-top:auto;font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase}
@media(max-width:900px){.navtiles{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.navtiles{grid-template-columns:1fr}.navtiles a{min-height:0}}

/* hero */
.hero{padding:44px 0 0}
.hero .eyebrow{font:600 italic 20px var(--serif);color:var(--gold)}
.hero h1{font-size:clamp(44px,7.5vw,104px);margin:14px 0 18px;max-width:15ch}
.hero h1 em{font-style:normal;color:var(--gold)}

/* film-strip frames (the 5 rules) */
.strip{background:var(--chalk);padding:22px 0;position:relative;margin-top:24px;border-radius:var(--r)}
.strip:before,.strip:after{content:"";position:absolute;left:10px;right:10px;height:12px;background:radial-gradient(circle at 12px 6px,var(--ink) 0 4.5px,transparent 5px) 0 0/28px 12px repeat-x}
.strip:before{top:4px}.strip:after{bottom:4px}
.frames{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:0 10px}
.frame{background:var(--ink);color:var(--chalk);text-decoration:none;padding:18px 16px 16px;min-height:250px;display:flex;flex-direction:column;gap:10px;border-radius:8px;transition:transform .2s}
.frame:hover{transform:translateY(-4px)}
.frame:hover .num{color:var(--gold)}
.frame .top{display:flex;align-items:center;justify-content:space-between}
.frame .num{font:700 44px/1 var(--head);transition:color .2s}
.frame .ico{width:34px;height:34px;color:var(--gold)}
.frame .tag{align-self:flex-start;font:700 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--gold);padding:3px 8px;border-radius:999px}
.frame h3{font-size:19px}
.frame p{font-size:13.5px;line-height:1.45;color:var(--chalk-2)}
.frame .go{margin-top:auto;font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.frame.on{outline:3px solid var(--gold);outline-offset:-3px}
@media(max-width:960px){.frames{grid-template-columns:1fr 1fr}.frame{min-height:0}}
@media(max-width:520px){.frames{grid-template-columns:1fr}}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:26px}
.tile{padding:22px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.tile .v{font:700 clamp(34px,4vw,48px)/1 var(--head);color:var(--gold)}
.tile .v.s{color:var(--red)}
.tile .l{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.tile p{font-size:14.5px;color:var(--chalk-2)}
@media(max-width:900px){.tiles{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.tiles{grid-template-columns:1fr}}

/* badges */
.badge{align-self:flex-start;display:inline-block;font:700 10.5px var(--body);letter-spacing:.04em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.orig{background:var(--chalk);color:var(--ink)}
.badge.ind{border:1px solid var(--line-3);color:var(--chalk-2)}

/* rule overview */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:26px}
.trio > div{padding:22px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--ink-2)}
.trio b{font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:10px}
@media(max-width:820px){.trio{grid-template-columns:1fr}}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:30px;list-style:none}
.steps li{border-top:2px solid var(--line-3);padding-top:16px}
.steps li:before{counter-increment:s;content:"0" counter(s);font:700 32px/1 var(--head);display:block;margin-bottom:10px;color:var(--gold)}
.steps h4{font-size:19px;margin-bottom:6px}
.steps p{font-size:15px;color:var(--chalk-2)}
@media(max-width:820px){.steps{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:30px}
.stat{border-top:2px solid var(--gold);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.stat.s{border-color:var(--red)}
.stat .v{font:700 42px/1 var(--head);color:var(--gold)}
.stat.s .v{color:var(--red)}
.stat p{font-size:14.5px;color:var(--chalk-2)}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.stats{grid-template-columns:1fr}}

/* on set */
.onset{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.scene{display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;border:1px solid var(--line-2);border-radius:var(--r);padding:18px;text-decoration:none;background:var(--ink-2);transition:border-color .2s}
.scene:hover{border-color:var(--gold)}
.scene.s:hover{border-color:var(--red)}
.scene img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px}
.scene .tag{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.scene.s .tag{color:var(--red)}
.scene h4{font-size:21px;margin:4px 0 8px}
.scene p{font-size:15px;color:var(--chalk-2)}
.scene .big{font:700 26px/1.1 var(--head);margin-top:12px;color:var(--gold)}
.scene.s .big{color:var(--red)}
.scene .go{display:block;margin-top:10px;font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
@media(max-width:860px){.onset{grid-template-columns:1fr}.scene{grid-template-columns:90px minmax(0,1fr)}}

/* charts */
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
.chart{border:1px solid var(--line-2);border-radius:var(--r);padding:24px;background:var(--ink-2);min-width:0}
.chart h3{margin-bottom:4px}
.chart .sub{font-size:13.5px;color:var(--mute);margin-bottom:16px}
.row{display:grid;grid-template-columns:140px minmax(0,1fr) 80px;align-items:center;gap:12px;margin:9px 0}
.row .lab{font-size:14px;font-weight:500}
.row .track{display:block;height:20px;background:var(--ink-3);border-radius:0 4px 4px 0}
.row .fill{display:block;height:100%;background:var(--gold);width:0;border-radius:0 4px 4px 0;opacity:.55;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.row .fill.s{background:var(--red)}
.row.hi .fill{opacity:1}
.row.hi .lab{font-weight:700}
.row .val{font:600 17px var(--head);text-align:right}
.row .nd{font-size:12px;color:var(--dim);padding-left:6px;line-height:20px}
.chart.txt .row{grid-template-columns:minmax(0,1fr) auto;border-bottom:1px solid var(--line);padding-bottom:9px}
.chart.txt .track{display:none}
.legend{display:flex;gap:16px;margin-top:14px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;background:var(--gold);border-radius:2px}
.legend i.s{background:var(--red)}
.takeaway{margin-top:16px;padding:14px 16px;border-left:3px solid var(--gold);background:var(--ink-3);border-radius:0 10px 10px 0;font-size:15px}
.takeaway .tl-lab{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:4px;color:var(--gold)}
.source{font-size:12.5px;color:var(--dim);margin-top:12px}
@media(max-width:560px){.row{grid-template-columns:96px minmax(0,1fr) 64px}}

/* your turn */
.toggle{display:inline-flex;gap:6px;padding:6px;border:1px solid var(--line-2);border-radius:999px}
.toggle button{font:700 14px var(--body);padding:0 18px;min-height:44px;border-radius:999px;color:var(--chalk-2)}
.toggle button[aria-pressed="true"].bb{background:var(--gold);color:var(--ink)}
.toggle button[aria-pressed="true"].sb{background:var(--red);color:var(--ink)}
.yours{background:var(--chalk);color:var(--ink);padding:34px;margin-top:20px;border-radius:18px;display:flex;flex-direction:column;gap:24px}
.yours .lab{font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--brown)}
.yours .lesson-t{font-size:18px;line-height:1.65}
.yours .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
@media(max-width:760px){.yours .cols{grid-template-columns:1fr}.yours{padding:24px}}
.yours ol{list-style:none;display:flex;flex-direction:column;gap:14px;margin-top:10px}
.yours li{border-top:2px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:3px}
.yours li b{font-size:16px}
.yours li span{font-size:15px;line-height:1.55}
.yours .metric{border-top:1px solid #C9B9A0;padding-top:16px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.yours .metric b{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:var(--chalk);padding:6px 10px;border-radius:999px}

/* films index */
.fgroups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px;margin-top:20px}
@media(max-width:860px){.fgroups{grid-template-columns:1fr}}
.posters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:14px}
.pcard{text-decoration:none;display:block}
.poster{aspect-ratio:2/3;max-width:100%;overflow:hidden;border:1px solid var(--line-2);border-radius:10px;background:var(--ink-2)}
.poster img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
.pcard:hover .poster img{transform:scale(1.04)}
.pcard:hover .poster{border-color:var(--gold)}
.pcard.s:hover .poster{border-color:var(--red)}
.pmeta{padding-top:10px}
.pmeta .n{font:700 18px/1.1 var(--head);text-transform:uppercase}
.pmeta .tag{font:700 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.pcard.s .pmeta .tag{color:var(--red)}

/* film page */
.fhead{display:grid;grid-template-columns:240px minmax(0,1fr);gap:36px;align-items:start}
@media(max-width:760px){.fhead{grid-template-columns:1fr}.fhead .poster{max-width:200px}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-3);padding:6px 11px;border-radius:999px}
.chip.bb{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.chip.sb{background:var(--red);color:var(--ink);border-color:var(--red)}
.goalq{font:700 clamp(26px,3.4vw,40px)/1.15 var(--head);text-transform:uppercase;max-width:26ch;margin-top:10px}
.ourread{display:inline-block;font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;border:1px dashed var(--line-3);color:var(--mute);padding:5px 10px;border-radius:999px;margin-top:14px}
.story{font:600 italic 21px/1.55 var(--serif);color:var(--chalk-2);margin-top:20px}
.timeline{position:relative;margin-top:10px;padding-left:36px}
.timeline:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line-3)}
.tl{position:relative;padding:0 0 26px}
.tl:before{content:"";position:absolute;left:-34px;top:4px;width:16px;height:16px;border-radius:999px;background:var(--ink);border:3px solid var(--acc)}
.tl.key:before{background:var(--acc)}
.tl .when{font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.tl h4{font-size:20px;margin:3px 0 4px}
.tl p{font-size:15px;color:var(--chalk-2);max-width:68ch}
.vs{border:1px solid var(--line-2);border-radius:var(--r);padding:24px;background:var(--ink-2)}
.vs .r{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:14px;align-items:center;margin:12px 0}
.vs .r .lab{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-2)}
.vs .r .track{display:block;height:32px;background:var(--ink-3);border-radius:0 6px 6px 0}
.vs .r .fill{display:block;height:100%;width:0;border-radius:0 6px 6px 0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.vs .r .fill.exp{background:var(--line-3)}
.vs .r .fill.act{background:var(--acc)}
.vs .r .val{font:700 22px var(--head);text-align:right}
@media(max-width:620px){.vs .r{grid-template-columns:90px minmax(0,1fr) 80px}}
.verdict{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.verdict b{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--ok);padding:7px 14px;border-radius:999px}
.acc{display:flex;flex-direction:column;gap:10px}
.dsec{border:1px solid var(--line-2);border-radius:var(--r);background:var(--ink-2);overflow:hidden}
.dsec[open]{border-color:var(--acc)}
.dsec summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:18px;padding:18px 22px}
.dsec summary::-webkit-details-marker{display:none}
.dsec summary:hover{background:var(--ink-3)}
.dsec summary:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.dsec .n{font:700 32px/1 var(--head);color:var(--acc)}
.dsec .st{min-width:0;display:flex;flex-direction:column;gap:2px}
.dsec h3{font-size:22px;margin:0}
.dsec .sub{font-size:14px;color:var(--mute)}
.dsec .cnt{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.dsec .chev{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);position:relative;flex:none}
.dsec .chev::before{content:"";position:absolute;left:50%;top:45%;width:9px;height:9px;border-right:2px solid var(--chalk);border-bottom:2px solid var(--chalk);transform:translate(-50%,-50%) rotate(45deg);transition:transform .2s}
.dsec[open] .chev{background:var(--acc);border-color:var(--acc)}
.dsec[open] .chev::before{top:55%;transform:translate(-50%,-50%) rotate(-135deg);border-color:var(--ink)}
.dbody{padding:4px 22px 24px}
.dsec .act{margin:0 0 18px;border-left:3px solid var(--acc);padding-left:12px;font-size:14.5px;color:var(--chalk-2);max-width:none}
.dsec .act b{color:var(--chalk)}
@media(max-width:620px){.dsec summary{grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:16px}.dsec .cnt{display:none}.dsec .n{font-size:26px}.dsec h3{font-size:19px}.dbody{padding:4px 16px 20px}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-content:start}
.dp{text-align:left;background:var(--ink-2);border:1px solid var(--line-2);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:9px;transition:border-color .2s}
.dp:hover{border-color:var(--acc)}
.dp .l{font:700 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.dp .v{font:700 32px/1.05 var(--head);color:var(--acc);overflow-wrap:anywhere}
.dp .v.long{font-size:24px}
.dp .v.gap{color:var(--dim)}
.dp .d{font-size:14px;line-height:1.55;color:var(--chalk-2)}
.dp .foot{margin-top:auto;padding-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.dp .more{font:600 13px var(--body);color:var(--acc)}
.used{display:grid;gap:12px}
.used a{display:grid;grid-template-columns:auto 56px minmax(0,1fr);gap:16px;align-items:center;border:1px solid var(--line-2);border-radius:var(--r);padding:16px 20px;text-decoration:none;background:var(--ink-2);transition:background .2s}
.used a:hover{background:var(--chalk);color:var(--ink)}
.used a:hover p{color:var(--brown)}
.used .ico{width:34px;height:34px;color:var(--gold)}
.used .n{font:700 34px/1 var(--head);color:var(--gold)}
.used h4{font-size:18px}
.used p{font-size:14.5px;color:var(--chalk-2)}
.lesson{border:2px solid var(--acc);border-radius:18px;padding:30px;margin-top:22px;font:700 clamp(22px,3vw,32px)/1.2 var(--head);text-transform:uppercase}
.lesson small{display:block;font:700 12px var(--body);letter-spacing:.14em;color:var(--acc);margin-bottom:12px}
.ugc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}
@media(max-width:820px){.ugc{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.ugc{grid-template-columns:1fr}}
.ugc div{border:2px dashed var(--line-3);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.ugc .ph-img{aspect-ratio:16/10;max-width:100%;border-radius:8px;background:repeating-linear-gradient(135deg,var(--ink-3) 0 12px,var(--ink-2) 12px 24px)}
.ugc small{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.ugc b{font-size:15.5px}

/* research / bts */
.team{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:24px}
.member{padding:18px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--ink-2);display:flex;flex-direction:column;gap:6px;min-width:0}
.member .shot{position:relative;aspect-ratio:1;max-width:100%;border-radius:calc(var(--r) - 4px);overflow:hidden;background:var(--ink-3);border:1px dashed var(--line-2);color:var(--line-2);display:grid;place-items:center;margin-bottom:8px}
.member .shot img{width:100%;height:100%;object-fit:cover}
.member .shot svg{width:55%;height:55%}
.member .ph-tag{position:absolute;bottom:8px;left:8px;font:700 10px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.member h4{font-size:18px}
.member p{font-size:14px;color:var(--chalk-2);margin:0}
.member .li{margin-top:auto;padding-top:8px;font:700 13px var(--body);color:var(--gold);text-decoration:none}
.member .li:hover{text-decoration:underline}
.member .li.off{color:var(--dim)}
@media(max-width:900px){.team{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.team{gap:10px}.member{padding:12px}}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:24px}
.why > div{padding:22px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--ink-2);display:flex;flex-direction:column;gap:8px}
.why .v{font:700 44px/1 var(--head);color:var(--gold)}
.why h4{font-size:18px}
.why p{font-size:14.5px;color:var(--chalk-2)}
.why .use{font:700 13px var(--body)}
.why .use a{color:var(--gold)}
.why .src{font-size:12px;color:var(--dim);margin-top:auto}
.tablewrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--r);margin-top:22px}
table.tools{width:100%;min-width:720px;border-collapse:collapse;font-size:14px}
table.tools th{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:left;background:var(--ink-2);padding:12px}
table.tools td{border-top:1px solid var(--line);padding:12px;vertical-align:top;color:var(--chalk-2)}
table.tools td:first-child{color:var(--chalk);font-weight:600}
.btslist{list-style:disc;padding-left:22px;color:var(--chalk-2);display:flex;flex-direction:column;gap:8px;margin-top:18px}
.btslist b{color:var(--chalk)}
.box{border:1px solid var(--line-2);border-radius:18px;padding:28px;margin-top:18px;display:flex;flex-direction:column;gap:10px}
.box h4{font-size:15px;letter-spacing:.1em;color:var(--gold)}
.box p{color:var(--chalk-2)}

/* scorecard */
.scorebar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:20;background:var(--ink-2);border:1px solid var(--line-2);border-radius:var(--r);padding:18px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;margin:20px 0}
.scorebar .tot{font:700 48px/1 var(--head);color:var(--gold)}
.scorebar .tot small{font-size:22px;color:var(--mute)}
.scorebar .msg{flex:1 1 280px}
.scorebar .msg b{display:block;font-size:16px}
.scorebar .msg span{font-size:13.5px;color:var(--mute)}
.btn-ghost{font:600 14px var(--body);color:var(--chalk-2);padding:0 18px;min-height:44px;border-radius:999px;border:1px solid var(--line-3)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.srule{border-top:1px solid var(--line);padding:34px 0;display:flex;flex-direction:column;gap:16px}
.srule .hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.srule .hd .t{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.srule .hd .ico{width:34px;height:34px;color:var(--gold)}
.srule .hd .num{font:700 40px/1 var(--head);color:var(--gold)}
.srule .hd h3{font-size:24px}
.status{font:700 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);padding:4px 10px;border-radius:999px;background:var(--dim);transition:background .3s}
.sbar{display:block;height:10px;background:var(--ink-3);border-radius:999px}
.sbar span{display:block;height:100%;border-radius:999px;transition:width .4s}
.q{border-top:1px solid var(--line);padding:16px 0;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.q .txt{flex:1 1 480px;display:flex;flex-direction:column;gap:5px;min-width:0}
.q .txt b{font-size:17.5px}
.q .txt .h{font-size:14px;color:var(--mute)}
.q .txt .w{font-size:14px;line-height:1.55;color:var(--chalk-2)}
.q .txt .w strong{color:var(--chalk)}
.opts{display:inline-flex;gap:8px}
.opts button{font:700 15px var(--body);min-width:76px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-3);color:var(--chalk-2)}
.opts button[aria-pressed="true"]{border-color:transparent;color:var(--ink)}
.fb{flex:1 1 100%;background:var(--chalk);color:var(--ink);border-left:4px solid var(--c);border-radius:0 12px 12px 0;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.fb .tg{align-self:flex-start;font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--c);padding:3px 9px;border-radius:999px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(13,10,9,.84);z-index:80;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none!important}
.dialog{width:100%;max-width:760px;max-height:86vh;overflow-y:auto;background:var(--ink-2);border:1px solid var(--line-3);border-radius:20px;padding:30px;display:flex;flex-direction:column;gap:16px}
.dialog .hd{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.dialog .hd small{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.dialog .hd .v{font:700 42px/1 var(--head);color:var(--acc);margin-top:6px}
.dialog .x{width:44px;height:44px;border-radius:999px;border:1px solid var(--line-3);font-size:22px;flex-shrink:0}
.dialog p{color:var(--chalk-2);font-size:16.5px;line-height:1.65}

footer{border-top:1px solid var(--line);margin-top:40px}
footer .wrap{padding-block:28px 40px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
footer .l{display:flex;flex-direction:column;gap:8px}
footer .l .row1{display:flex;flex-wrap:wrap;gap:6px 22px}
footer .l .row2{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;align-items:center}
footer a{color:var(--chalk-2)}
footer .dl{display:inline-flex;align-items:center;gap:8px;background:var(--chalk);color:var(--ink);font-weight:700;text-decoration:none;padding:0 20px;min-height:44px;border-radius:999px}
footer .dl:hover{background:var(--gold)}

/* ---- motion: subtle ---- */
.rv{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
.dp,.tile,.stat,.navtiles a,.pcard,.scene,.member,.used a,.pager a,.why>div{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease,background .25s ease,opacity .55s ease}
.dp:hover,.tile:hover,.stat:hover,.navtiles a:hover,.scene:hover,.member:hover,.used a:hover,.why>div:hover{transform:translateY(-3px);box-shadow:0 14px 34px -16px var(--glow)}
.pcard:hover{transform:translateY(-4px)}
.dp:hover{border-color:var(--acc,var(--gold))}
.frame{transition:background .25s ease,transform .25s ease}
.frame:hover{transform:translateY(-3px)}
.hero h1 em{position:relative;display:inline-block}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.06em;height:.07em;background:var(--gold);transform-origin:left;transform:scaleX(0);animation:sweep .9s .5s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes sweep{to{transform:scaleX(1)}}
.hero h1,.hero .eyebrow,.hero .lede,.hero .ctas{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.hero h1{animation-delay:.08s}.hero .lede{animation-delay:.18s}.hero .ctas{animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.brand .dot{animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:8px 8px 0 -2px var(--red),0 0 0 0 rgba(229,9,20,0)}50%{box-shadow:8px 8px 0 -2px var(--red),0 0 14px 2px var(--glow)}}
.dsec[open] .dbody{animation:drop .35s cubic-bezier(.2,.7,.2,1)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.dialog{animation:pop .28s cubic-bezier(.2,.7,.2,1)}
.modal{animation:fadein .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.tabs a{transition:background .25s ease,color .25s ease}
.cta{transition:background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease}
.cta:hover{transform:translateY(-2px)}
</style>

rt", "key": "lbwatch"}}, {"label": "Letterboxd · Liked", "value": "2.2M", "detail": "Liked by 2,195,808 members, 42% of those who watched it.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "lblike"}}, {"label": "Letterboxd · Lists", "value": "644K", "detail": "Appears in 643,857 member lists.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "lblist"}}, {"label": "Letterboxd · Top 500", "value": "#127", "detail": "Number 127 on the Letterboxd Top 500, the site's ranking of its highest-rated films.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "The Odyssey is number 127 on the Letterboxd Top 500, the site's ranking of its highest-rated films. A spot on the Top 500 keeps a film in front of film-literate viewers long after release."}}, {"label": "Critics score (RT · Metacritic)", "value": "94% · 88", "detail": "94% of critics gave it a positive review and they averaged 88/100 on Metacritic. Opening-night audiences graded it A (CinemaScore).", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "meta"}}, {"label": "Critics vs. audience gap", "value": "31-pt gap", "detail": "Critics scored it 88/100; everyday Metacritic users gave it 57/100. On Rotten Tomatoes, 94% of critics and 97% of audiences liked it. Critics liked it far more than regular viewers. Its earliest fans on Letterboxd were glowing: 4.61★, 89% positive.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "Critics scored it 88/100; everyday Metacritic users gave it 57/100. On Rotten Tomatoes, 94% of critics and 97% of audiences liked it. Critics liked it far more than regular viewers. Its earliest fans on Letterboxd were glowing: 4.61★, 89% positive. A big gap can spark a debate that keeps a film in the news. A small gap means reviews and word of mouth tell the same story."}}]}, {"cat": "made", "title": "What was made", "sub": "Signature craft choice and worldwide ÷ budget", "how": "Make production choices that create a premium experience, then sell that experience.", "cards": [{"label": "Signature craft choice", "value": "First on IMAX film", "detail": "The first movie shot entirely on IMAX film cameras: 91 shoot days across 6 countries, real ships and 35-ft Trojan horses, a Ludwig Göransson score and an all-star cast.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "The first movie shot entirely on IMAX film cameras: 91 shoot days across 6 countries, real ships and 35-ft Trojan horses, a Ludwig Göransson score and an all-star cast. Production choices like these give marketing real stories to tell before release."}}, {"label": "Worldwide ÷ production budget", "value": "7.3×", "detail": "Earned 7.3 times its $250.0M production budget in worldwide ticket sales (marketing costs not included).", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "budget"}}, {"label": "Why it mattered and who it reached", "value": "Sold the big screen", "detail": "Shooting on IMAX film gave fans a reason to pay more: PLF screens earned 53% of the opening, and by August it had passed Avatar as IMAX's highest-grossing film ever. It pulled in film lovers and Gen Z, who seek out premium formats, and 24% of audience posts talked about the filmmaking (n = 100 coded posts).", "src": "Industry + SMACC original", "gap": false, "pop": {"type": "text", "text": "Shooting on IMAX film gave fans a reason to pay more: PLF screens earned 53% of the opening, and by August it had passed Avatar as IMAX's highest-grossing film ever. It pulled in film lovers and Gen Z, who seek out premium formats, and 24% of audience posts talked about the filmmaking (n = 100 coded posts). This is where production decisions turned into marketing results."}}]}, {"cat": "cast", "title": "Who was in it and who they reached", "sub": "Cast reach, amplification, pairing and fans", "how": "Lead with your most trusted name, and post the cast together on social, where pairs got 5.4× the views.", "cards": [{"label": "Cast reach", "value": "44% came for the cast", "detail": "In opening-weekend surveys, 44% of viewers said the ensemble cast was a reason they came, and 27% named Matt Damon, who plays Odysseus, on his own. On TikTok, videos naming Zendaya or Tom Holland reached about 3.4 times more people.", "src": "Industry + SMACC original", "gap": false, "pop": {"type": "text", "text": "In opening-weekend surveys, 44% of viewers said the ensemble cast was a reason they came, and 27% named Matt Damon, who plays Odysseus, on his own. On TikTok, videos naming Zendaya or Tom Holland reached about 3.4 times more people. It shows whether the stars actually brought people in, or whether something else did."}}, {"label": "Cast amplification share", "value": "36%", "detail": "Of 33,082 posts on X that named the cast or the director, 36% named the cast. Higher means the stars, not the filmmaker, drove the conversation.", "src": "SMACC original", "gap": false, "pop": {"type": "chart", "key": "amp"}}, {"label": "Pairing lift", "value": "5.4×", "detail": "TikToks featuring two or more stars together got 5.4 times the views of videos with just one star. One star alone did no better than none. (Median views, Odyssey TikTok sample, Apr–Oct 2026.)", "src": "SMACC original", "gap": false, "pop": {"type": "text", "text": "TikToks featuring two or more stars together got 5.4 times the views of videos with just one star. One star alone did no better than none. (Median views, Odyssey TikTok sample, Apr–Oct 2026.) It shows whether putting stars together in content earned more attention than solo posts."}}, {"label": "Fan participation", "value": "33%", "detail": "A third of TikTok views came from everyday fans with under 10,000 followers, more than from big accounts. (n = 975 TikTok videos, Apr–Oct 2026.)", "src": "SMACC original", "gap": false, "pop": {"type": "text", "text": "A third of TikTok views came from everyday fans with under 10,000 followers, more than from big accounts. (n = 975 TikTok videos, Apr–Oct 2026.) Fan participation is free marketing that reaches people through friends instead of ads."}}]}, {"cat": "sold", "title": "How it was sold", "sub": "Buzz, trust and PLF share", "how": "Release less, later. Make each reveal feel like a reward.", "cards": [{"label": "Scarcity = buzz (first reaction)", "value": "Jul 6 · 11 days out", "detail": "Reactions were held until the London premiere, and the first teaser played only in theaters. On the London and Paris premiere day, posts hit 51 times a normal day (102 posts vs. a typical 2).", "src": "Industry + SMACC original", "gap": false, "pop": {"type": "text", "text": "Reactions were held until the London premiere, and the first teaser played only in theaters. On the London and Paris premiere day, posts hit 51 times a normal day (102 posts vs. a typical 2). The timing of first reactions decides when buzz peaks. The goal is a peak right before opening."}}, {"label": "Audience trust (influencer marketing)", "value": "81%", "detail": "81% of opening-weekend viewers said they would definitely recommend it. Universal skipped influencer screenings and showed it to critics first. Early fan reviews were still 89% positive, with almost no 'overhyped' talk.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "rec"}}, {"label": "Premium-format (PLF) share of opening", "value": "53%", "detail": "53% of opening-weekend ticket sales came from IMAX and other PLF screens. By Aug 9 its IMAX gross had reached $289M, passing Avatar ($256M) as IMAX's highest-grossing film ever (TheWrap).", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "premium"}}]}, {"cat": "showed", "title": "Who showed up", "sub": "Attendance, drivers and demographics", "how": "Match each audience to the name or feature that brings them in.", "cards": [{"label": "Attendance rate", "value": "$31,514", "detail": "Each theater averaged this much in ticket sales on opening weekend, a sign of how full the screens were.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "pta"}}, {"label": "Attendance-driver share", "value": "51% for Nolan", "detail": "Christopher Nolan was the top reason people came (51%), ahead of the cast (44%).", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "Christopher Nolan was the top reason people came (51%), ahead of the cast (44%). Knowing why people came tells marketers which name or feature to lead with next time."}}, {"label": "Demographics", "value": "59% male", "detail": "55% were under 35 (about half aged 18–34). The audience was 50% white, 22% Hispanic, 12% Black and 9% Asian.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "55% were under 35 (about half aged 18–34). The audience was 50% white, 22% Hispanic, 12% Black and 9% Asian. Who showed up shows which parts of the campaign reached their audience."}}, {"label": "Cast effects on demographics", "value": "Cast + Nolan", "detail": "Its young, fan-favorite stars (Zendaya, Tom Holland, Robert Pattinson) helped a three-hour epic draw about half its audience aged 18–34.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "Its young, fan-favorite stars (Zendaya, Tom Holland, Robert Pattinson) helped a three-hour epic draw about half its audience aged 18–34. Casting choices shape which audiences a campaign can reach."}}]}, {"cat": "online", "title": "What people said online", "sub": "Social buzz, sentiment, virality and UGC", "how": "Give fans a talking point (a rule, a limit, a secret) that's easy to joke about.", "cards": [{"label": "Social buzz", "value": "21,156", "detail": "Posts on X around its release, and 2,159 more in the last 90 days. Its top 50 Reddit posts drew 2,363 comments.", "src": "SMACC original", "gap": false, "pop": {"type": "chart", "key": "reddit"}}, {"label": "Letterboxd average rating", "value": "4.3★", "detail": "Average rating out of 5 on Letterboxd, where 60% of users gave it 4.5 or 5 stars. 97% of Rotten Tomatoes audiences liked it. Early posts on Letterboxd and Reddit were 86% positive (n = 602 Letterboxd and 204 Reddit entries).", "src": "Industry + SMACC original", "gap": false, "pop": {"type": "chart", "key": "lb"}}, {"label": "Viral per platform", "value": "121.4M", "detail": "Views of the first trailer in 24 hours, spread across TikTok (27%), YouTube (26%), Facebook (21%), Instagram (18%) and X (10%). Its 100 latest TikToks drew 4,394,334 plays.", "src": "Industry + SMACC original", "gap": false, "pop": {"type": "text", "text": "Views of the first trailer in 24 hours, spread across TikTok (27%), YouTube (26%), Facebook (21%), Instagram (18%) and X (10%). Its 100 latest TikToks drew 4,394,334 plays. Platform reach shows where the conversation actually happened."}}]}, {"cat": "lasted", "title": "Did it last?", "sub": "Legs", "how": "Plan premium re-releases as part of the campaign, not as an afterthought.", "cards": [{"label": "Legs multiple (domestic total ÷ opening)", "value": "5.1×", "detail": "Over its full run in the US it earned 5.1 times its opening weekend. Its weekend 2 was down 27% from the first. It jumped 65% when IMAX screens came back in week 13.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "legs"}}]}], "young": "~50% aged 18–34 (Universal via Reuters)", "story": "Universal made The Odyssey something you had to plan for. Christopher Nolan shot it entirely on IMAX film, and select IMAX 70mm tickets went on sale a full year early; about 95% sold within an hour. The first teaser played only in theaters, and reactions were held until the London premiere. That scarcity turned a three-hour epic into an event: a $123.5M opening, 53% of it from PLF screens, and about $1.82B worldwide.", "head": "Scarcity sold the event"}, "barbie": {"ugc": [["image", "Barbie Selfie Generator posters", "Fan-made posters from the selfie tool"], ["play", "Teaser trailer", "The 2001-style first teaser, Dec 2022"], ["image", "Malibu Dreamhouse on Airbnb", "The real-life Dreamhouse listing"], ["image", "Brand partnerships", "Crocs, Xbox, Progressive and more"], ["chat", "Barbenheimer fan posts", "Fan-made double-feature memes and outfits"], ["star", "Press tour looks", "Margot Robbie's recreated Barbie outfits"]], "cats": [{"cat": "result", "title": "Did it work?", "sub": "The result", "how": "Measure success against the projection, not just the total. Build the campaign so the opening becomes a moment people plan around.", "cards": [{"label": "Domestic total / Opening weekend (domestic)", "value": "$636.8M / $162.0M", "detail": "Made $162.0M in its first weekend in the US and Canada and $636.8M there by the end of its run, plus $1.45B worldwide.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "domestic"}}, {"label": "Worldwide ÷ total cost", "value": "4.9×", "detail": "Every $1 spent making and marketing it ($145.0M + $150.0M) brought back $4.91 in worldwide ticket sales. Estimated profit: about $547.9M.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "roc"}}, {"label": "Opening ÷ projection", "value": "2.16×", "detail": "Opened at $162.0M, 2.2 times what was expected. Warner Bros. projected $75M; outside tracking said $90M–$130M.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "forecast"}}]}, {"cat": "received", "title": "How was it received?", "sub": "Critics vs. audience", "how": "Don't fear a film people argue about. Plan for the conversation and give fans the talking points to defend it.", "cards": [{"label": "Letterboxd · Watched", "value": "8.3M", "detail": "Watched by 8,278,205 Letterboxd members.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "lbwatch"}}, {"label": "Letterboxd · Liked", "value": "3.1M", "detail": "Liked by 3,061,191 members, 37% of those who watched it.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "lblike"}}, {"label": "Letterboxd · Lists", "value": "648K", "detail": "Appears in 647,755 member lists.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "lblist"}}, {"label": "Critics score (RT · Metacritic)", "value": "88% · 80", "detail": "88% of critics gave it a positive review and they averaged 80/100 on Metacritic. Opening-night audiences graded it A (CinemaScore).", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "meta"}}, {"label": "Critics vs. audience gap", "value": "22-pt gap", "detail": "Critics scored it 80/100; everyday Metacritic users gave it 58/100. On Rotten Tomatoes, 88% of critics and 83% of audiences liked it. Critics liked it far more than regular viewers. Its earliest fans on Letterboxd were glowing: 4.55★, 97% positive.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "Critics scored Barbie 80/100, while everyday Metacritic users gave it 58. The gap came from its themes: some viewers pushed back online while fans defended it. For marketers, that split kept Barbie in the conversation for weeks. Its earliest Letterboxd fans were glowing (4.55★, 97% positive), and they set the tone on opening weekend."}}]}, {"cat": "made", "title": "What was made", "sub": "Signature craft choice and worldwide ÷ budget", "how": "Flag the production details that make news during pre-production, and release them as stories, not just behind-the-scenes extras.", "cards": [{"label": "Signature craft choice", "value": "4 craft Oscar noms", "detail": "A hand-built, hand-painted pink Barbie Land (the set used so much pink paint the supplier ran out), Margot Robbie and Ryan Gosling, and songs that earned two Oscar nominations and one win.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "The production itself became marketing. The hand-painted pink Barbie Land used so much paint that the supplier reportedly ran out, and that story spread long before release. Margot Robbie and Ryan Gosling, plus a soundtrack that earned two Oscar nominations and a win, gave the campaign assets beyond the trailer."}}, {"label": "Worldwide ÷ production budget", "value": "10.0×", "detail": "Earned 10.0 times its $145.0M production budget in worldwide ticket sales (marketing costs not included).", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "budget"}}, {"label": "Why it mattered and who it reached", "value": "Made pre-release news", "detail": "The pink-paint shortage story ran 46 days before release and turned set design into headlines, drawing fashion and brand fans and the most female audience of the six (65%). After seeing it, people talked more about Ken and the themes; only 14% of posts mentioned the filmmaking (n = 116 coded posts).", "src": "Industry + SMACC original", "gap": false, "pop": {"type": "text", "text": "The pink-paint shortage story broke 46 days before release and turned set design into headlines. It reached fashion and brand fans, helping Barbie draw the most female audience of the six films (65%). After release, people talked more about Ken and the film's themes than the filmmaking; only 14% of posts mentioned craft."}}]}, {"cat": "cast", "title": "Who was in it and who they reached", "sub": "Cast reach, amplification, pairing and fans", "how": "When stars are your strongest name, give them a role in the campaign beyond interviews, like a signature look or a challenge.", "cards": [{"label": "Cast reach", "value": "Robbie + Gosling", "detail": "Margot Robbie and Ryan Gosling were mentioned about twice as often as director Greta Gerwig on X, and Robbie turned the press tour into a Barbie fashion show.", "src": "SMACC original", "gap": false, "pop": {"type": "text", "text": "Margot Robbie and Ryan Gosling were mentioned about twice as often as director Greta Gerwig on X. Robbie's press tour recreated classic Barbie looks, so every appearance became shareable fashion content. The stars, not the filmmaker, carried the campaign."}}, {"label": "Cast amplification share", "value": "66%", "detail": "Of 735 posts on X that named the cast or the director, 66% named the cast. Higher means the stars, not the filmmaker, drove the conversation.", "src": "SMACC original", "gap": false, "pop": {"type": "chart", "key": "amp"}}, {"label": "Pairing lift", "value": "Not measured", "detail": "Not tracked for this film. Only The Odyssey and Anyone But You have data on stars appearing together.", "src": null, "gap": true, "pop": {"type": "text", "text": "We don't have data on how Barbie's stars performed when they appeared together. Only The Odyssey and Anyone But You were tracked for pairing lift."}}, {"label": "Fan participation", "value": "200K+", "detail": "More than 200,000 people booked same-day Barbie and Oppenheimer double features, and fans dressed in pink for screenings.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "More than 200,000 people booked same-day Barbie and Oppenheimer double features, and fans dressed in pink for screenings. Nobody planned Barbenheimer, but the studio leaned in. Fans turned two competing releases into one event, and it worked as free marketing for both films."}}]}, {"cat": "sold", "title": "How it was sold", "sub": "Buzz, trust and PLF share", "how": "Pick creators whose audience matches yours, and give them early access so their reactions land right before release.", "cards": [{"label": "Scarcity = buzz (first reaction)", "value": "Jul 10, 2023 · 11 days out", "detail": "Influencers and preview audiences posted first. The second teaser alone drew 7.5M engagements in one day.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "First reactions from influencers and preview audiences landed July 10, 2023, 11 days before release. By then the campaign had been building for over a year: the second teaser alone drew 7.5M engagements in a single day. Holding first reactions until the last two weeks kept that momentum peaking at release."}}, {"label": "Audience trust (influencer marketing)", "value": "5/5 PostTrak", "detail": "Warner Bros. went influencer-first, with 244 influencer partnerships reaching 438M impressions. Opening audiences gave it 5 out of 5 stars in PostTrak exit polls.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "Warner Bros. went influencer-first, with 244 influencer partnerships reaching 438M impressions. Opening audiences gave the film 5 out of 5 stars in PostTrak exit polls, the top score, so the people fans trusted online matched what audiences felt in theaters."}}, {"label": "Premium-format (PLF) share of opening", "value": "10%", "detail": "10% of opening-weekend ticket sales came from IMAX and other PLF screens. Oppenheimer held about 80% of PLF screens that weekend.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "premium"}}]}, {"cat": "showed", "title": "Who showed up", "sub": "Attendance, drivers and demographics", "how": "Market the outing, not just the movie: dress codes, group tickets and double features turn one ticket into three.", "cards": [{"label": "Attendance rate", "value": "$38,186", "detail": "Each theater averaged this much in ticket sales on opening weekend, a sign of how full the screens were. About 12.8M people went opening weekend.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "pta"}}, {"label": "Attendance-driver share", "value": "Group outings", "detail": "No survey asked why, but buyers bought about 3 tickets at a time and 200,000+ booked Barbenheimer double features, a sign people came with friends.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "No survey asked why people came, but the buying pattern tells the story: about 3 tickets per purchase, and 200,000+ Barbenheimer double features. Barbie was a group outing. Marketing that made the film feel like an occasion (dress up, bring friends) turned single tickets into groups."}}, {"label": "Demographics", "value": "65% female", "detail": "81% were under 35 and 40% under 25. The audience was 56% white, 23% Hispanic, 10% Black and 7% Asian.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "Barbie's audience was 65% female, the most of the six films. 81% were under 35 and 40% were under 25. It was also one of the most diverse audiences: 56% white, 23% Hispanic, 10% Black and 7% Asian."}}, {"label": "Cast effects on demographics", "value": "Star-led skew", "detail": "Margot Robbie and a fashion-led pink campaign pulled the most female audience of the six films (65%).", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "Margot Robbie and a fashion-led pink campaign pulled the most female audience of the six films (65%). Pairing the stars with fashion and beauty brands put the campaign in spaces where young women already shopped and scrolled."}}]}, {"cat": "online", "title": "What people said online", "sub": "Social buzz, sentiment, virality and UGC", "how": "Build one simple, shareable tool in pre-production that lets fans put themselves in the campaign.", "cards": [{"label": "Social buzz", "value": "42,082", "detail": "Comments on its 50 most popular Reddit posts (297,590 upvotes). Older X data from 2023 is too incomplete to compare.", "src": "SMACC original", "gap": false, "pop": {"type": "chart", "key": "reddit"}}, {"label": "Letterboxd average rating", "value": "3.7★", "detail": "Average rating out of 5 on Letterboxd, where 28% of users gave it 4.5 or 5 stars. 83% of Rotten Tomatoes audiences liked it.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "lb"}}, {"label": "Viral per platform", "value": "4.6B", "detail": "Views on #BarbieTheMovie, with 23M likes, comments and shares, according to Mattel. Its 100 latest TikToks drew 5,657,894 plays.", "src": "Industry + SMACC original", "gap": false, "pop": {"type": "text", "text": "#BarbieTheMovie drew 4.6B views and 23M likes, comments and shares, according to Mattel. Its 100 most recent TikToks pulled 5.7M plays. No other film in our study came close in scale."}}, {"label": "User-generated content (UGC)", "value": "13M", "detail": "People made their own Barbie movie posters with the Barbie Selfie Generator.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "Fans made 13M of their own Barbie posters with the Barbie Selfie Generator before release. It's the clearest example of Rule 04: hand fans something to do. Every poster was free, personal advertising shared with that person's own followers."}}]}, {"cat": "lasted", "title": "Did it last?", "sub": "Legs", "how": "Pair an event opening with a plan for weeks two through ten, like re-releases, premium runs or new content drops.", "cards": [{"label": "Legs multiple (domestic total ÷ opening)", "value": "3.9×", "detail": "Over its full run in the US it earned 3.9 times its opening weekend. Its weekend 2 was down 43% from the first. A one-week IMAX run in September brought its smallest late drop.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "legs"}}]}], "young": "40% under 25 (PostTrak via AP)", "story": "Barbie turned a toy brand into a cultural event. Warner Bros. built the campaign around one color: pink. It showed up in brand partnerships, a real-life Malibu Dreamhouse and a selfie generator that let anyone make their own poster. Fans did the rest. The \"Barbenheimer\" double feature, which no studio planned, became free marketing that pushed Barbie's opening to more than double Warner's projection.", "head": "A toy brand turned cultural event"}, "sinners": {"ugc": [["play", "Coogler's format explainer", "IMAX 70mm vs. Ultra Panavision 70"], ["play", "Sports tentpole spots", "Christmas NBA, NFL playoffs and the Grammys"], ["image", "Fortnite ticketing & TikTok hub", "First-to-market ticketing and Spotlight Hub"], ["people", "'Fit for Fangs' truck tour", "Times Square to Coachella with influencers"], ["star", "Gold grillz trend", "Fans copying the London premiere look"], ["people", "Film club screenings", "Group screenings organized by Black-led film clubs"]], "cats": [{"cat": "result", "title": "Did it work?", "sub": "The result", "how": "Originals can open big when the campaign sells trusted names and a premium experience.", "cards": [{"label": "Domestic total / Opening weekend (domestic)", "value": "$280.0M / $48.0M", "detail": "Made $48.0M in its first weekend in the US and Canada and $280.0M there by the end of its run, plus $370.3M worldwide.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "domestic"}}, {"label": "Worldwide ÷ total cost", "value": "2.6×", "detail": "Every $1 spent making and marketing it ($90.0M + $55.0M) brought back $2.55 in worldwide ticket sales. Estimated profit: about $83.0M.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "roc"}}, {"label": "Opening ÷ projection", "value": "1.37×", "detail": "Opened at $48.0M, 1.4 times what was expected. Early tracking said the mid-$30Ms; later estimates rose to $40M–$45M.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "forecast"}}]}, {"cat": "received", "title": "How was it received?", "sub": "Critics vs. audience", "how": "When reviews are strong, release them early to start word of mouth before opening.", "cards": [{"label": "Letterboxd · Watched", "value": "5.8M", "detail": "Watched by 5,767,694 Letterboxd members.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "lbwatch"}}, {"label": "Letterboxd · Liked", "value": "2.4M", "detail": "Liked by 2,427,176 members, 42% of those who watched it.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "lblike"}}, {"label": "Letterboxd · Lists", "value": "818K", "detail": "Appears in 818,478 member lists.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "lblist"}}, {"label": "Critics score (RT · Metacritic)", "value": "97% · 84", "detail": "97% of critics gave it a positive review and they averaged 84/100 on Metacritic. Opening-night audiences graded it A (CinemaScore).", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "meta"}}, {"label": "Critics vs. audience gap", "value": "9-pt gap", "detail": "Critics scored it 84/100; everyday Metacritic users gave it 75/100. On Rotten Tomatoes, 97% of critics and 96% of audiences liked it. Critics liked it somewhat more than regular viewers.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "Critics scored it 84/100; everyday Metacritic users gave it 75/100. On Rotten Tomatoes, 97% of critics and 96% of audiences liked it. Critics liked it somewhat more than regular viewers. A big gap can spark a debate that keeps a film in the news. A small gap means reviews and word of mouth tell the same story."}}]}, {"cat": "made", "title": "What was made", "sub": "Signature craft choice and worldwide ÷ budget", "how": "Make the craft part of the pitch, and explain why the format matters.", "cards": [{"label": "Signature craft choice", "value": "9 craft Oscar noms", "detail": "Shot in two large film formats in one movie. Its score and cinematography both won Oscars, and Autumn Durald Arkapaw became the first woman to win for cinematography.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "Shot in two large film formats in one movie. Its score and cinematography both won Oscars, and Autumn Durald Arkapaw became the first woman to win for cinematography. Production choices like these give marketing real stories to tell before release."}}, {"label": "Worldwide ÷ production budget", "value": "4.1×", "detail": "Earned 4.1 times its $90.0M production budget in worldwide ticket sales (marketing costs not included).", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "budget"}}, {"label": "Why it mattered and who it reached", "value": "Premium seats + awards", "detail": "Coogler's video e "type": "text", "text": "Critics scored it 52/100; everyday Metacritic users gave it 58/100. On Rotten Tomatoes, 53% of critics and 87% of audiences liked it. Critics and audiences mostly agreed. A big gap can spark a debate that keeps a film in the news. A small gap means reviews and word of mouth tell the same story."}}]}, {"cat": "made", "title": "What was made", "sub": "Signature craft choice and worldwide ÷ budget", "how": "Write one musical or visual moment into the script that fans can copy.", "cards": [{"label": "Signature craft choice", "value": "Sydney on location", "detail": "Filmed at real Sydney landmarks (the Opera House, Harbour Bridge and Bondi) with Sydney Sweeney and Glen Powell, using the song 'Unwritten' as a recurring moment.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "Filmed at real Sydney landmarks (the Opera House, Harbour Bridge and Bondi) with Sydney Sweeney and Glen Powell, using the song 'Unwritten' as a recurring moment. Production choices like these give marketing real stories to tell before release."}}, {"label": "Worldwide ÷ production budget", "value": "8.8×", "detail": "Earned 8.8 times its $25.0M production budget in worldwide ticket sales (marketing costs not included).", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "budget"}}, {"label": "Why it mattered and who it reached", "value": "Escapism + a song", "detail": "Sunny Sydney locations gave winter audiences an escapist getaway, and the 'Unwritten' scene gave young women a moment to recreate, sparking the exit-dance trend. The filmmaking itself got little attention (12% of posts, n = 115 coded posts).", "src": "Industry + SMACC original", "gap": false, "pop": {"type": "text", "text": "Sunny Sydney locations gave winter audiences an escapist getaway, and the 'Unwritten' scene gave young women a moment to recreate, sparking the exit-dance trend. The filmmaking itself got little attention (12% of posts, n = 115 coded posts). This t TikToks drew 13,604,669 plays.", "src": "Industry + SMACC original", "gap": false, "pop": {"type": "text", "text": "More of its sampled TikToks passed 100,000 plays than any other film here, on top of about 200M YouTube views before release. Its 100 latest TikToks drew 13,604,669 plays. Platform reach shows where the conversation actually happened."}}, {"label": "User-generated content (UGC)", "value": "~10K", "detail": "Fan TikToks in the month of release, and even brands like McDonald's, IKEA and Minecraft made their own Backrooms posts.", "src": "Industry data", "gap": false, "pop": {"type": "text", "text": "Fan TikToks in the month of release, and even brands like McDonald's, IKEA and Minecraft made their own Backrooms posts. Fan-made content works like a personal recommendation, reaching people ads can't."}}]}, {"cat": "lasted", "title": "Did it last?", "sub": "Legs", "how": "Plan marketing for non-fans after opening weekend to extend the run.", "cards": [{"label": "Legs multiple (domestic total ÷ opening)", "value": "2.4×", "detail": "Over its full run in the US it earned 2.4 times its opening weekend. Its weekend 2 was down 68% from the first. Most of its money came early; a July re-release slowed its drop.", "src": "Industry data", "gap": false, "pop": {"type": "chart", "key": "legs"}}]}], "young": "66% under 25 (exit polls via Screen Daily)", "story": "A24 built on years of work by creator Kane Parsons, whose YouTube series made the Backrooms famous. The campaign stayed where fans already were, on YouTube and TikTok, ran in-universe ads and let brands like McDonald's and IKEA join in for free. Fans turned out: an $81.4M opening on a $10M budget, 4.1× the projection. But a B- CinemaScore and a 68% second-weekend drop show that fandom fuels openings more than long runs.", "head": "A fandom that opened big"}}, "charts": {"presale": {"title": "Days tickets were on sale before release", "note": "", "vals": {"odyssey": [365, "365"], "barbie": [30, "30"], "sinne
