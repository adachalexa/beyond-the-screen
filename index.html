[3.93, "3.9×"], "sinners": [5.83, "5.8×"], "obsession": [15.32, "15.3×"], "aby": [14.72, "14.7×"], "backrooms": [2.43, "2.4×"]}}, "wk2": {"title": "Weekend 2 as % of opening", "note": "Over 100% means the film grew in weekend 2. Source: Industry data · The Numbers weekend grosses.", "vals": {"odyssey": [73, "73%"], "barbie": [57, "57%"], "sinners": [95, "95%"], "obsession": [139, "139%"], "aby": [146, "146%"], "backrooms": [32, "32%"]}}, "amp": {"title": "Posts naming the cast vs. the director or creator", "note": "Share of posts on X that named the cast rather than the director or creator. n: The Odyssey 33,082; Barbie 735; Sinners 3,077; Obsession 4,942; Backrooms 8,631. Anyone But You is left out (only 35 posts). Source: SMACC original · X post counts around each film's release.", "vals": {"odyssey": [36, "36%"], "barbie": [66, "66%"], "sinners": [26, "26%"], "obsession": [53, "53%"], "backrooms": [9, "9%"]}}, "domestic": {"title": "Domestic total", "note": "US and Canada, full run. Source: Industry data · The Numbers, final or latest totals (Nov 2026).", "vals": {"odyssey": [625.6, "$625.6M"], "barbie": [636.8, "$636.8M"], "sinners": [280.0, "$280.0M"], "obsession": [263.5, "$263.5M"], "aby": [88.3, "$88.3M"], "backrooms": [197.5, "$197.5M"]}}, "roc": {"title": "Worldwide ÷ total cost (budget + marketing)", "note": "Focus never reported Obsession's marketing spend. Source: Industry data · The Numbers grosses; budgets and marketing from trade reports.", "vals": {"odyssey": [4.86, "4.9×"], "barbie": [4.91, "4.9×"], "sinners": [2.55, "2.6×"], "obsession": [null, ""], "aby": [2.44, "2.4×"], "backrooms": [20.0, "20.0×"]}}, "meta": {"title": "Metacritic critic score", "note": "Source: Industry data · Metacritic, Nov 2026.", "vals": {"odyssey": [88, "88"], "barbie": [80, "80"], "sinners": [84, "84"], "obsession": [77, "77"], "aby": [52, "52"], "backrooms": [76, "76"]}}, "budget": {"title": "Worldwide ÷ production budget", "note": "Production budget only. Source: Industry data · The Numbers and trade-reported budgets.", "vals": {"odyssey": [7.3, "7.3×"], "barbie": [10.0, "10.0×"], "sinners": [4.1, "4.1×"], "obsession": [695.0, "695×"], "aby": [8.8, "8.8×"], "backrooms": [40.0, "40.0×"]}}, "lb": {"title": "Letterboxd average rating", "note": "Out of 5. Source: Industry data · Letterboxd, Nov 2026.", "vals": {"odyssey": [4.3, "4.3★"], "barbie": [3.7, "3.7★"], "sinners": [4.1, "4.1★"], "obsession": [4.1, "4.1★"], "aby": [2.8, "2.8★"], "backrooms": [3.3, "3.3★"]}}, "lbwatch": {"title": "Letterboxd members who watched it", "note": "Members who logged the film as watched on Letterboxd. Source: Industry data · Letterboxd member counts, Nov 2026.", "vals": {"odyssey": [5.245057, "5.2M"], "barbie": [8.278205, "8.3M"], "sinners": [5.767694, "5.8M"], "obsession": [6.122601, "6.1M"], "aby": [2.688784, "2.7M"], "backrooms": [3.896354, "3.9M"]}}, "lblike": {"title": "Letterboxd members who liked it", "note": "Members who liked the film on Letterboxd. Source: Industry data · Letterboxd member counts, Nov 2026.", "vals": {"odyssey": [2.195808, "2.2M"], "barbie": [3.061191, "3.1M"], "sinners": [2.427176, "2.4M"], "obsession": [2.375153, "2.4M"], "aby": [0.516888, "0.5M"], "backrooms": [1.102168, "1.1M"]}}, "lblist": {"title": "Letterboxd lists it appears in", "note": "Number of member lists that include the film. Source: Industry data · Letterboxd member counts, Nov 2026.", "vals": {"odyssey": [643.857, "644K"], "barbie": [647.755, "648K"], "sinners": [818.478, "818K"], "obsession": [621.437, "621K"], "aby": [202.708, "203K"], "backrooms": [427.327, "427K"]}}}, "rules": {"1": {"stats": [["365", "days early: when select Odyssey IMAX 70mm tickets went on sale", "bb"], ["45%", "of Sinners' opening came from PLF screens", "bb"], ["$750K", "Obsession's budget. Focus bought it for $14M", "sb"], ["4.07×", "Backrooms' opening vs. its projection", "sb"]], "ex": [["odyssey", "Shot the whole film on IMAX film", "The first movie shot entirely on IMAX film cameras. Universal sold the format as the reason to see it.", "53% of the opening from premium screens"], ["sinners", "Explained the format to fans", "Two large film formats in one movie, plus Coogler's video explaining them, sent fans to PLF screens.", "45% from premium screens"], ["obsession", "Built the film around one prop and one look", "The One Wish Willow and Nikki's makeup were designed in production and became TikTok trends.", "652K+ fan posts"], ["backrooms", "Built the YouTube world for real", "The series' yellow rooms filled 30,000+ sq ft of real sets, giving fans exactly what they knew.", "58% came for the story"]], "budget": {"bb": {"summary": "Blockbusters locked in a premium format or a signature look at greenlight, then sold it as the reason to see the film in theaters.", "lesson": "Each blockbuster locked in one big-screen craft choice before filming. The Odyssey was the first film shot entirely on IMAX film, and its 70mm tickets went on sale a year early; PLF screens earned 53% of its opening. Sinners shot in two 65mm formats and Coogler explained why in a video, helping 45% of its opening come from PLF screens. Barbie's hand-painted pink sets made headlines 46 days before release. Because the hook was set early, the campaign had real proof to show for months.", "prod": [["Pick the format and the release plan together", "Decide camera, format and venues at greenlight: IMAX or 70mm prints, which theaters, and the on-sale date."], ["Plan the making-of as news", "Flag production details, like Barbie's hand-painted sets, that marketing can release as stories before the trailer."]], "mark": [["Open presales early for the premium version", "The Odyssey's 70mm shows went on sale a year out, and about 95% sold within an hour."], ["Explain the upgrade to fans", "A short filmmaker explainer, like Coogler's format video, turns a technical choice into a reason to pay more."]]}, "sb": {"summary": "Small budget films couldn't sell PLF screens, so they locked in a creator, a world or a single image fans could copy.", "lesson": "With no IMAX screens, small budget films needed a hook that worked on phones. Obsession was built around one prop and one look, made for $750K, and fans made 652K+ posts recreating them. Backrooms rebuilt the YouTube series' yellow rooms on real sets, giving fans the world they knew; 58% came for the story. Anyone But You wrote 'Unwritten' into the film, and it became an exit dance with 602M views. Each hook was a production choice first and a marketing asset second.", "prod": [["Choose one cheap, phone-sized signature", "A prop, a look or a musical cue that reads clearly in a 10-second clip."], ["Protect what a built-in audience already loves", "If the film comes from an online world, build it the way fans already know it."]], "mark": [["Take the signature into the real world", "Billboards and product drops: Obsession's One Wish Willow drop sold out within hours."], ["Amplify fan recreations", "Repost and reward fans who copy the prop, look or scene."]]}}}, "2": {"stats": [["51%", "of Odyssey viewers came for Christopher Nolan, ahead of the cast (44%)", "bb"], ["47%", "of Sinners viewers came for Michael B. Jordan", "bb"], ["1.8×", "Views on a casual Anyone But You cast clip vs. the official trailer", "sb"], ["58%", "of Backrooms viewers came for a story they already knew online", "sb"]], "ex": [["odyssey", "Sold the director first", "Nolan was the top reason people came, ahead of the ensemble led by Matt Damon as Odysseus (27% came for Damon alone). Universal sold it as a Nolan event and used the young cast to reach TikTok.", "51% came for Nolan"], ["barbie", "Turned the press tour into the campaign", "Margot Robbie and Ryan Gosling were mentioned about twice as often as Greta Gerwig. Robbie's Barbie-look press tour kept the stars in every feed.", "66% of posts named the cast"], ["aby", "Let the stars' chemistry do the selling", "A casual clip of Sydney Sweeney and Glen Powell whispering got 18M views, nearly double the official trailer.", "1.8× the trailer's views"], ["backrooms", "Trusted the creator over the cast", "Fans talked about director Kane Parsons almost 10 times more than the cast. A24 marketed his world, not its stars.", "Only 9% of posts named the cast"]], "budget": {"bb": {"summary": "Big films already have famous names. The winning move was choosing which one leads: the director for The Odyssey, the stars for Barbie, and both for Sinners.", "lesson": "Every blockbuster had famous names, but each led with a different one. The Odyssey led with its director: 51% came for Nolan, ahead of the cast (44%). Barbie led with its stars, who drove 66% of cast-or-director posts. Sinners paired both: 47% came for Michael B. Jordan and 40% for Ryan Coogler, and friends' recommendations carried it from there. The key is knowing which name your audience trusts most.", "prod": [["Decide at greenlight which name leads", "Use past PostTrak data to see whether your audience buys for the director, the star or the brand."], ["Schedule the stars to appear together", "Odyssey TikToks with two or more stars got 5.4× the views of solo-star videos."]], "mark": [["Lead every asset with that name", "Trailer cards, posters and PLF pushes. Sinners was sold as a horror film from the director of Black Panther and Creed."], ["Give stars a campaign role beyond interviews", "A signature look, like Robbie's press-tour outfits, turns every appearance into shareable content."]]}, "sb": {"summary": "Small budget films rarely have a famous name, so they borrowed trust: a YouTube creator's fanbase for Obsession and Backrooms, and two rising stars' chemistry for Anyone But You.", "lesson": "Small budget films rarely had a famous name, so they borrowed trust from audiences that already existed. Backrooms fans talked about creator Kane Parsons almost 10× more than the cast, and 58% came for his story. Obsession's director brought his 1M+ YouTube subscribers, then an unknown lead broke out after release. Anyone But You sold its stars' chemistry: a casual clip got 18M views, almost double the official trailer.", "prod": [["Map the existing audience before greenlight", "Count subscribers, subreddit and Discord members, or a star's social following."], ["Bring the creator or stars in as partners", "Sydney Sweeney was an executive producer and part of Sony's marketing calls."]], "mark": [["Make social-first content with the leads together", "A casual Sweeney and Powell clip got 1.8× the trailer's views."], ["Be ready for a breakout", "With no stars, sell the character, like Nikki, and push the actor once fans find them."]]}}}, "3": {"stats": [["$162.0M", "Barbie's opening, 2.2× Warner's projection", "bb"], ["$31,514", "The Odyssey's opening average per theater", "bb"], ["87%", "of Anyone But You audiences liked it, vs. 53% of critics", "sb"], ["43%", "of all moviegoers saw Backrooms on its opening weekend", "sb"]], "ex": [["odyssey", "Promised the biggest screen", "Shot on IMAX film and sold as an IMAX event, with tickets a year early.", "53% of the opening from premium screens"], ["barbie", "Promised an occasion", "Pink everything made Barbie a night out. Buyers averaged about 3 tickets each.", "200K+ Barbenheimer double features"], ["aby", "Promised a sunny escape", "Sydney beaches and a sing-along song gave winter audiences a getaway.", "Grew 4 weekends in a row"], ["backrooms", "Promised the world fans knew", "It delivered the YouTube rooms fans loved, but newcomers were less sold.", "B- CinemaScore after an $81.4M opening"]], "budget": {"bb": {"summary": "Each blockbuster promised an event: The Odyssey in IMAX, Barbie in pink, and Sinners on PLF screens with a story worth talking about.", "lesson": "Each blockbuster gave people one reason to buy a ticket now. The Odyssey promised the biggest screen, and 53% of its opening came from PLF screens. Barbie promised an occasion: pink outfits, group outings and Barbenheimer, opening at $162.0M, 2.2× the projection. Sinners promised a premium experience worth talking about, and 84% of opening viewers would definitely recommend it.", "prod": [["Write the promise in one line during pre-production", "For example, \"see it in IMAX 70mm\" or \"wear pink, bring friends.\""], ["Make sure the film delivers it", "Strong PostTrak recommend scores (81% for The Odyssey, 84% for Sinners) turn an event opening into word of mouth."]], "mark": [["Test every asset against the promise", "If a trailer, partner or stunt doesn't support it, cut it."], ["Make it something people plan around", "Presales, double features and group tickets turn the promise into a date on the calendar."]]}, "sb": {"summary": "Small budget films promised a feeling: a creepy story to share for Obsession, a sunny escape for Anyone But You and the world fans already loved for Backrooms.", "lesson": "Small budget films promised a feeling instead of an event. Obsession promised a creepy story to share, and 70% would definitely recommend it. Anyone But You promised a sunny escape; critics were lukewarm, but 87% of audiences liked it. Backrooms promised the world its fans already knew and drew 43% of moviegoers that weekend, but its B- CinemaScore shows the promise worked for fans more than newcomers.", "prod": [["Promise the feeling the film delivers best", "Fear, escape or belonging, in words your audience already uses."], ["Know who the promise is for", "Fans and newcomers need different messages, so plan both from the start."]], "mark": [["Match the trailer to the experience", "A promise the film can't keep fades after opening weekend."], ["Lean on audience reactions when critics are mixed", "Anyone But You's audience scores outran its reviews."]]}}}, "4": {"stats": [["13M", "Barbie posters made by fans with the Selfie Generator", "bb"], ["10.5M", "fan videos and posts about Sinners in four months", "bb"], ["602M", "views of Anyone But You's 'Unwritten' exit dance", "sb"], ["400K", "fans signed up to get texts from Obsession's Nikki", "sb"]], "ex": [["barbie", "A tool to make your own poster", "The Barbie Selfie Generator let anyone put themselves in the campaign.", "13M posters"], ["sinners", "A look to copy", "Fans copied the gold-grillz look from the London premiere, and film clubs organized group screenings.", "10.5M fan posts"], ["aby", "A dance to join", "Fans started dancing to 'Unwritten' as they left theaters; Sony and the cast joined in.", "265K TikTok videos"], ["obsession", "A character to text", "Nikki's billboards had a real number that texted back, plus an online quest.", "400K sign-ups, 1.7M quest players"]], "budget": {"bb": {"summary": "Blockbusters gave fans a tool to use or a look to copy: Barbie's selfie posters, Sinners' gold grillz and The Odyssey's fan-made TikToks.", "lesson": "Blockbusters had big ad budgets, but fan activity reached people ads couldn't. Barbie's Selfie Generator let 13M people make their own poster. Sinners fans copied the gold-grillz look, and film clubs organized group screenings. Even The Odyssey, which skipped influencer screenings, got a third of its TikTok views from everyday fans.", "prod": [["Design a signature look into the film", "Something fans can wear to a screening, like Barbie's pink or Sinners' gold grillz."], ["Plan group-viewing formats with distribution", "Double features, film-club screenings and group tickets turn fan activity into ticket sales."]], "mark": [["Budget for one fan tool alongside the trailer", "A poster generator, filter or quiz that lets fans put themselves in the campaign."], ["Seed creators whose audience matches yours", "Give them early access so their content lands right before release."]]}, "sb": {"summary": "Small budget films made participation the campaign: a text line for Obsession, an exit dance for Anyone But You and hidden lore for Backrooms fans to decode.", "lesson": "For small budget films, fan participation was the campaign. Obsession gave fans a character to text, and 400K signed up for Nikki's messages. Anyone But You's 'Unwritten' exit dance started with fans, then Sony joined in, reaching 602M views. Backrooms left lore for fans to decode, and about 10,000 fan TikToks drew 1.1B views.", "prod": [["Write one repeatable action into the film", "Text, sing, decode or dress up: one action anyone can copy."], ["Leave your world open for others to play in", "Lore to decode and assets to remix let fans and brands join in for free."]], "mark": [["Put the hook in the real world", "Billboards, lobby machines and product drops give fans something to film."], ["Amplify fan trends fast", "Repost, credit fans and bring the cast in, the way Sony did with the exit dance."]]}}}, "5": {"stats": [["5%", "Sinners' drop in weekend 2", "bb"], ["+65%", "The Odyssey's jump when IMAX screens returned in week 13", "bb"], ["15.3×", "Obsession's legs multiple", "sb"], ["−68%", "Backrooms' drop in weekend 2", "sb"]], "ex": [["obsession", "Grew after opening", "Obsession grew in weekends 2 and 3 and led the box office on weekdays.", "15.3× its opening"], ["aby", "Kept growing for a month", "It grew four weeks in a row, then drew 24.7M views on Netflix.", "Weekend two up 46%"], ["odyssey", "Brought back the format", "When IMAX screens returned in week 13, ticket sales jumped 65%.", "5.1× its opening"], ["backrooms", "Opened huge, then faded", "Fans showed up on opening weekend, but newcomers didn't follow. A July re-release slowed the drop.", "Only 2.4× its opening"]], "budget": {"bb": {"summary": "Blockbusters extended their runs with premium re-releases and strong recommendations. Sinners barely dropped in weekend 2.", "lesson": "Blockbusters spend most of their budget before opening, so the run depends on recommendations and re-releases. Sinners dropped just 5% in weekend 2 as younger viewers arrived, for legs of 5.8×. The Odyssey jumped 65% when IMAX screens returned in week 13. Barbie had the biggest opening but the shortest legs of the three (3.9×), because the event pulled demand forward.", "prod": [["Schedule PLF re-releases in pre-production", "Tie them to awards season or holidays, like Sinners' Halloween IMAX run."], ["Shoot extra content to hold back", "A prologue or featurette, like The Odyssey's surprise 6-minute prologue, keeps the conversation going later."]], "mark": [["Plan a second wave for word-of-mouth audiences", "Younger viewers arrived later for Sinners, after hearing from friends."], ["Track recommendation scores to guide spending", "Keep spending where audiences are recommending the film."]]}, "sb": {"summary": "Two small budget films grew after opening thanks to word of mouth and repeat viewing. Backrooms, the most fan-driven, opened biggest and faded fastest.", "lesson": "The two smallest openings had the longest legs. Obsession rose 39% in weekend 2 and finished with legs of 15.3×, the best of the six. Anyone But You grew four weeks in a row as fans came back with friends, finishing at 14.7×. Backrooms opened biggest at $81.4M but dropped 68% in weekend 2: a built-in audience guarantees the opening, not the run.", "prod": [["Plan the release for a long run", "Don't judge a word-of-mouth film by opening weekend; keep screens and budget behind it."], ["Save budget for weeks 2 through 10", "Fresh content and fan moments after opening keep it growing."]], "mark": [["Market the rewatch", "Group nights, sing-alongs and return visits."], ["Reach beyond the fandom after opening", "New messaging for newcomers once the core fans have seen it."]]}}}}, "sc": {"1": [{"id": "r1q0", "q": "Have you picked one signature element that will sell the film?", "hint": "A format, a look, a prop, a world or a song, chosen before the shoot.", "why": "Every film we studied sold one thing decided before filming: The Odyssey's IMAX film, Sinners' two 65mm formats, Barbie's pink sets, Obsession's One Wish Willow and Backrooms' yellow rooms. Without one, the campaign has nothing only your film can offer.", "bb": ["List what only your film can offer on a big screen (a format, a scale, a look) and pick one before the shoot locks.", "Narrow it to one. The Odyssey sold IMAX film, not five things at once."], "sb": ["Pick one cheap element a phone can capture in 10 seconds: a prop, a look, a song or a place.", "Make it easier to copy. Obsession's prop and makeup worked because fans could recreate them at home."], "yes": "Make sure every trailer and poster shows it."}, {"id": "r1q1", "q": "Will production give marketing proof of it before release?", "hint": "Footage, a making-of story, a presale or a first look built around it.", "why": "A hook only sells if people can see it. Barbie's paint-shortage story ran 46 days before release, and The Odyssey's 70mm tickets went on sale a year early.", "bb": ["Plan one pre-release proof point: a presale for the premium version, a set story or a filmmaker explainer.", "Put a date on it. Decide when the proof goes public, ideally months out, not in the final weeks."], "sb": ["Capture the signature on set for social: behind-the-scenes clips, a first look or a real-world version of the prop.", "Turn it into something fans can touch. Obsession's One Wish Willow drop sold out within hours."], "yes": "Lock the release date for each proof point into the campaign calendar."}], "2": [{"id": "r2q0", "q": "Do you know which name your audience trusts most?", "hint": "The director, a star, a creator or the brand, based on tracking or past exit polls.", "why": "Audiences buy from names they trust. 51% of Odyssey viewers came for Nolan, and 58% of Backrooms viewers came for the story its creator built online.", "bb": ["Check past PostTrak exit polls for your director's and stars' last films to see who actually drives tickets.", "Pick one lead name. Barbie led with its stars; The Odyssey led with its director."], "sb": ["Look for borrowed trust: a creator with a following, a community, or a rising star with social reach.", "Measure it. Count the subscribers, subreddit members or followers that name brings."], "yes": "Write that name into the campaign brief so every asset leads with it."}, {"id": "r2q1", "q": "Will that name lead the trailer, poster and social plan?", "hint": "Including content where the stars or creator appear together.", "why": "Odyssey TikToks with two or more stars got 5.4× the views of solo-star videos, and a casual Anyone But You clip of the leads got 1.8× the trailer's views.", "bb": ["Rebuild the trailer card and poster around the name, and schedule the stars for joint press and social content.", "Add joint content. Posts with stars together beat solo posts."], "sb": ["Bring the creator or stars into the marketing plan now, not after the edit.", "Swap one polished asset for a casual one. Social-first clips with the leads beat the trailer."], "yes": "Build joint appearances into the shoot and press schedule."}], "3": [{"id": "r3q0", "q": "Can you say why to buy a ticket in one sentence?", "hint": "An event to see in theaters, or a feeling people want.", "why": "The biggest openings had one reason to go: The Odyssey promised the biggest screen, Barbie an occasion. Small films promised a feeling, like Anyone But You's sunny escape.", "bb": ["Write it now: \"See it in [format]\" or \"Bring friends to [event].\" If it takes two sentences, it isn't one promise.", "Cut the extras. Test each trailer and partner against the one sentence."], "sb": ["Name the feeling the film delivers best (fear, escape, belonging) in words your audience already uses.", "Make sure the trailer shows that feeling, not just the plot."], "yes": "Put the sentence at the top of every creative brief."}, {"id": "r3q1", "q": "Will you check that the film delivers that promise?", "hint": "Test screenings, early reactions or recommend scores before the wide push.", "why": "A promise only builds word of mouth if the film keeps it. Sinners earned an A CinemaScore and 84% definite recommend; Backrooms' B- shows a promise that worked for fans more than newc  3:[['Can you say why to buy a ticket in one sentence?','An event to see in theaters, or a feeling people want.'],['Will you check that the film delivers that promise?','Test screenings, early reactions or recommend scores before the wide push.']],
 4:[['Is there one thing fans can copy or join?','A look, a line, a dance, a tool or a mystery to decode.'],['Is it built into the film or campaign before release?','So fans can start making content before opening weekend.']],
 5:[['Is budget saved for weeks 2 through 10?','Not everything spent on opening weekend.'],['Is there a plan to reach beyond core fans after opening?','Re-releases, new content or a second wave for word-of-mouth audiences.']]};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const acc = id => FILMS[id].budget === 'b' ? 'var(--gold)' : 'var(--red)';
const poster = id => `<div class="poster"><img src="posters/${id}.jpg" alt="${esc(FILMS[id].name)} poster" loading="lazy"></div>`;
const badge = s => !s ? '' : `<span class="badge ${s==='SMACC original'?'orig':'ind'}">${esc(s)}</span>`;

function chart(c){
  const max = Math.max(...c.rows.map(r=>r[1]||0));
  const fmt = (v,r) => r[3] ? r[3] : v==null ? '' : c.unit==='$' ? '$'+v.toLocaleString() : (c.unit==='×'? v+'×' : c.unit==='%'? v+'%' : v.toLocaleString());
  return `<div class="chart ${c.text?'txt':''}"><h3>${c.title}</h3><div class="sub">${c.sub}</div>
    ${c.rows.map(r=>`<div class="row ${r[0]===c.hi?'hi':''}"><span class="lab">${esc(r[0])}</span>
      <span class="track">${c.text?'':r[1]==null?'<span class="nd">No data</span>':`<span class="fill ${r[2]==='s'?'s':''}" data-w="${Math.max(1.5,(r[1]/max)*100)}"></span>`}</span>
      <span class="val">${r[1]==null?'—':fmt(r[1],r)}</span></div>`).join('')}
    <div class="legend"><span><i></i>Blockbuster</span><span><i class="s"></i>Small budget</span></div>
    <div class="takeaway"><span class="tl-lab">What this shows</span>${c.take}</div>
    <div class="source">${c.src}</div></div>`;
}
function tabs(items, cur){
  return `<nav class="tabs" aria-label="Sections">${items.map(([h,l],i)=>`<a href="#${h}" class="${h===cur?'on':''}" ${h===cur?'aria-current="page"':''}><span>0${i+1}</span>${l}</a>`).join('')}</nav>`;
}
function pager(prev, next){
  return `<div class="pager">
    ${prev?`<a href="#${prev[0]}"><small>← ${prev[1]}</small><span>${prev[2]}</span></a>`:'<span class="empty"></span>'}
    ${next?`<a class="nx" href="#${next[0]}"><small>${next[1]} →</small><span>${next[2]}</span></a>`:'<span class="empty"></span>'}
  </div>`;
}
function head(crumbs, facts){
  return `<div class="wrap"><div class="crumbs">${crumbs}</div>${facts?`<div class="facts">${facts.map(([k,v])=>`<div><b>${k}</b><span>${esc(v)}</span></div>`).join('')}</div>`:''}</div>`;
}
function frames(active){
  return `<div class="strip"><div class="frames">${RULES.map(t=>`
    <a class="frame ${active===t.n?'on':''}" href="#rule-${t.n}">
      <span class="top"><span class="num">0${t.n}</span><span class="ico">${ICONS[t.key]}</span></span>

      <h3>${t.title}</h3><p>${t.one}</p><span class="go">Open rule ${t.n} →</span></a>`).join('')}</div></div>`;
}

/* ---------------- SCORECARD ---------------- */
const sc = { b:'bb', a:{} };
function scorecard(){
  let total=0, answered=0, totalQs=0;
  const rulesHtml = RULES.map(r=>{
    const qs = DATA.sc[r.n]; let pts=0, done=0;
    const qh = qs.map((q,qi)=>{
      totalQs++; const v = sc.a[q.id]; if(v!==undefined){pts+=v;done++;answered++;}
      const col = v===2?'var(--ok)':v===1?'var(--gold)':'var(--red)';
      const fb = v===undefined ? '' : `<div class="fb" style="--c:${col}"><span class="tg">${v===2?'On track':v===1?'Close the gap':'Start here'}</span><span>${esc(v===2?q.yes:q[sc.b][v])}</span></div>`;
      return `<div class="q"><div class="txt"><b>${esc(SCQ[r.n][qi][0])}</b><span class="h">${esc(SCQ[r.n][qi][1])}</span><span class="w"><strong>Why it matters:</strong> ${esc(q.why)}</span></div>
        <div class="opts" role="group" aria-label="Answer">${['No','Partly','Yes'].map((l,val)=>`<button data-q="${q.id}" data-v="${val}" aria-pressed="${v===val}" style="${v===val?'background:'+(val===2?'var(--ok)':val===1?'var(--gold)':'var(--red)'):''}">${l}</button>`).join('')}</div>${fb}</div>`;
    }).join('');
    total+=pts; const max=qs.length*2, complete=done===qs.length;
    const status = !complete?'Answer both':pts===max?'Strong':pts>=max/2?'Partial':'Gap';
    const scol = !complete?'var(--dim)':pts===max?'var(--ok)':pts>=max/2?'var(--gold)':'var(--red)';
    return `<section class="srule"><div class="hd"><div class="t"><span class="num">0${r.n}</span><span class="ico">${ICONS[r.key]}</span><h3>${r.title}</h3></div>
      <span style="display:flex;align-items:center;gap:12px"><span style="font:600 22px var(--head)">${pts} / ${max}</span><span class="status" style="background:${scol}">${status}</span></span></div>
      <span class="sbar"><span style="width:${Math.max(3,pts/max*100)}%;background:${scol}"></span></span>${qh}
      ${complete && pts<max ? `<p class="small">Want more? <a href="#rule-${r.n}-yours" class="gold">See Rule ${r.n}’s full playbook →</a></p>`:''}</section>`;
  }).join('');
  const maxT = totalQs*2, pct = total/maxT*100, all = answered===totalQs;
  const msg = all ? (pct>=80?'Ready to greenlight: the plan covers most of the playbook.':pct>=50?'Promising, with gaps to close before greenlight.':'Major gaps: work through the next steps below.') : 'Answer every question to see your full result.';
  return `<div class="page">${head(`<a href="#home">Home</a> / Greenlight scorecard`)}
  <div class="wrap pagebody">
    <div class="kicker">For producers · Interactive</div>
    <h1 class="ph">Greenlight scorecard</h1>
    <p class="lede">Score your own film against the five rules. Pick a budget, answer two questions per rule, and each answer opens a next step. Nothing is saved between visits.</p>
    <div class="scorebar"><span class="tot">${total}<small> / ${maxT}</small></span><span class="msg"><b>${msg}</b><span>${answered} of ${totalQs} answered · ${sc.b==='bb'?'Blockbuster':'Small budget'} playbook</span></span>
      <div class="toggle" role="group" aria-label="Budget"><button class="bb" data-scb="bb" aria-pressed="${sc.b==='bb'}">Blockbuster</button><button class="sb" data-scb="sb" aria-pressed="${sc.b==='sb'}">Small budget</button></div>
      <button class="btn-ghost" data-screset>Start over</button></div>
    ${rulesHtml}
    <p class="small" style="margin-top:16px">Scoring: No = 0, Partly = 1, Yes = 2. The scorecard reflects patterns from six successful films; it’s a planning guide, not a box office prediction.</p>
  </div></div>`;
}

/* ---------------- BEHIND THE SCENES ---------------- */
/* Fill in: name, role, img (e.g. 'team/alexa.jpg'), li (full LinkedIn URL) */
const TEAM = Array.from({length:8},(_,i)=>({name:'Team member '+(i+1), role:'Research lane', img:'', li:''}));
function bts(cur){
  const items=[['behind-the-scenes','The question'],['bts-data','The data'],['bts-limits','The limits'],['bts-team','Meet the team']];
  let body='';
  if(cur==='behind-the-scenes') body = `<p class="lede">When a film is made and then sold, which marketing decisions in pre-production lead to success, and how do they differ for a blockbuster and a small budget film?</p>
    <div class="used" style="margin-top:24px">${[['odyssey','An event blockbuster with a ticketing-led rollout'],['barbie','A brand-saturation campaign for a toy-brand film'],['sinners','An original, filmmaker-driven premium-format release'],['obsession','A micro-budget, creator-made film that grew after opening'],['aby','A modest rom-com that kept growing through social media'],['backrooms','A YouTube story turned theatrical, with a record A24 opening']]
      .map(([id,t])=>`<a href="#film-${id}"><span class="ico" style="color:${acc(id)}">${ICONS[id==='odyssey'?'hook':id==='barbie'?'fans':id==='sinners'?'name':id==='obsession'?'hook':id==='aby'?'fans':'run']}</span><span class="n" style="font-size:13px;font-family:var(--body);color:${acc(id)}">${FILMS[id].budget==='b'?'BIG':'SMALL'}</span><div><h4>${FILMS[id].name}</h4><p>${t}</p></div></a>`).join('')}</div>`;
  else if(cur==='bts-data') body = `<p class="lede">The same 25 data points for each film, from two kinds of sources. Every number on the site carries one of these labels.</p>
    <div class="trio" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><span class="badge orig">SMACC original</span><p style="margin-top:10px">Measured by our team: X post counts and cast-vs-director share, TikTok samples, Reddit and Letterboxd coding, sentiment and premiere-day spikes.</p></div>
      <div><span class="badge ind">Industry data</span><p style="margin-top:10px">The Numbers, Box Office Mojo, Deadline, Variety, The Hollywood Reporter, PostTrak, CinemaScore, Rotten Tomatoes, Metacritic and Letterboxd.</p></div></div>
    <div class="tablewrap"><table class="tools"><thead><tr><th>What we measured</th><th>Where</th><th>Date range</th><th>Sample</th></tr></thead><tbody>
      <tr><td>Posts naming the cast vs. the director</td><td>X via Xpoz</td><td>Around each release; Odyssey Jun 17–Sep 15, 2026</td><td>Odyssey 33,082 · Barbie 735 · Sinners 3,077 · Obsession 4,942 · Backrooms 8,631 (Anyone But You’s 35 left out)</td></tr>
      <tr><td>TikTok reach and creator size</td><td>TikTok via Xpoz</td><td>Odyssey Apr–Oct 2026; 100 recent posts per film (Nov 2026)</td><td>975 Odyssey videos; 100 posts per film (Sinners 36 and Anyone But You 4 left out)</td></tr>
      <tr><td>Pairing lift</td><td>TikTok</td><td>Apr–Oct 2026</td><td>Odyssey TikTok sample, median views by stars named</td></tr>
      <tr><td>Cast moment lift</td><td>X daily posts</td><td>Baseline Apr 1–Jun 30, 2026</td><td>Posts per day vs. a median of 2</td></tr>
      <tr><td>Reddit conversation</td><td>Reddit via Xpoz</td><td>Collected Nov 2026</td><td>Top 50 posts per film</td></tr>
      <tr><td>Filmmaking share of talk</td><td>Reddit r/movies + Letterboxd</td><td>Collected Nov 2026</td><td>Hand-coded: 70–92 Reddit comments + 24 Letterboxd reviews per film (Backrooms’ 94 left out)</td></tr>
      <tr><td>Early sentiment (The Odyssey)</td><td>Letterboxd, Reddit, Metacritic</td><td>Jun 28–Sep 22, 2026</td><td>1,137 entries, keyword-scored</td></tr>
      <tr><td>Box office, polls and reviews</td><td>Trades and trackers</td><td>Final or latest totals (Nov 2026)</td><td>All six films</td></tr>
    </tbody></table></div>
    <ul class="btslist"><li><b>Cast vs. director:</b> X searches pairing each title with its director’s name or its main cast names, counted separately.</li><li><b>Filmmaking talk:</b> each comment and review hand-coded with every theme it mentioned; a post could get more than one code.</li><li><b>Team:</b> the class split into research lanes (box office, audience and Gen Z, cast, technical craft, sentiment), then combined them into one master data set.</li></ul>`;
  else if(cur==='bts-team') body = `<p class="lede">The SMACC Fall 2026 research team at the University of Connecticut.</p>
    <div class="team">${TEAM.map(p=>`<div class="member">
      <div class="shot">${p.img?`<img src="${p.img}" alt="Headshot of ${esc(p.name)}" loading="lazy">`:`<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="24" r="12" fill="currentColor"/><path d="M8 60c2-14 12-21 24-21s22 7 24 21z" fill="currentColor"/></svg><span class="ph-tag">Headshot</span>`}</div>
      <h4>${esc(p.name)}</h4><p>${esc(p.role)}</p>
      ${p.li?`<a class="li" href="${p.li}" target="_blank" rel="noopener">LinkedIn →</a>`:`<span class="li off">LinkedIn link</span>`}
    </div>`).join('')}</div>`;
  else body = `<div class="box"><h4>What this research can’t tell you</h4><p>All six films succeeded. The five rules describe what these winners had in common, not proof that the rules cause success. A film can follow every rule and still underperform.</p><p>Barbie and Anyone But You came out in 2023 and were measured after the fact, so their social data is partial.</p></div>
    <div class="box"><h4>Other limits</h4><p>Genre, quality and budget size aren’t controlled for. Our social samples are directional, not statistically representative, and percentages based on fewer than 100 posts were left out. Age brackets differ by tracker, so each film’s young audience share names its range. The Odyssey’s totals were still growing when collected (Nov 2026).</p></div>`;
  const idx = items.findIndex(x=>x[0]===cur);
  const prev = idx>0?[items[idx-1][0],'Back',items[idx-1][1]]:['home','Back','Home'];
  const next = idx<items.length-1?[items[idx+1][0],'Next',items[idx+1][1]]:['home','Back to','Home'];
  return `<div class="page">${head(`<a href="#home">Home</a> / How we did it`)}
  <div class="wrap pagebody">
    <h1 class="ph">How we did it</h1>
    ${tabs(items,cur)}
    <div class="panel">${body}</div>
    ${pager(prev,next)}
  </div></div>`;
}

/* ============================================================
   ROUTER + EVENTS
   ============================================================ */
function render(keepScroll){
  const h = (location.hash||'#home').slice(1);
  let html, nav='home', m; curFilm = null;
  if((m=h.match(/^rule-([1-5])(?:-(onset|proof|yours))?$/))){ html = rule(+m[1], m[2]); nav='rules'; }
  else if(h==='rules'){ html = rulesIndex(); nav='rules'; }
  else if(h==='films'){ html = films(); nav='films'; }
  else if((m=h.match(/^film-([a-z]+?)(?:-(plan|results|lessons))?$/)) && FILMS[m[1]]){ html = film(m[1], m[2]); nav='films'; curFilm=m[1]; }
  else if(h==='research'){ html = research(); nav='research'; }
  else if(h==='scorecard'){ html = scorecard(); nav='scorecard'; }
  else if(['behind-the-scenes','bts-data','bts-limits','bts-team'].includes(h)){ html = bts(h); nav='behind-the-scenes'; }
  else html = home();
  $('#modal').hidden = true;
  $('#app').innerHTML = html;
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===nav));
  $('#links').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded','false');
  if(!keepScroll) window.scrollTo(0,0);
  const t = document.querySelector('#app h1')?.textContent;
  document.title = t && nav!=='home' ? t+' · Beyond the Screen' : 'Beyond the Screen';
  animateBars();
}
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let io;
function reveal(){
  if(REDUCED || !('IntersectionObserver' in window)) return;
  if(io) io.disconnect();
  io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); countUp(e.target); } }),{rootMargin:'0px 0px -6% 0px'});
  const sel='.dp,.tile,.stat,.navtiles a,.pcard,.scene,.member,.used a,.why>div,.trio>div,.steps>*,.charts>*,.tl,.srule,.box,.frame';
  const groups=new Map();
  document.querySelectorAll('#app '+sel.split(',').join(',#app ')).forEach(el=>{
    if(el.closest('details:not([open])')) return;
    const p=el.parentElement; const i=groups.get(p)||0; groups.set(p,i+1);
    el.style.setProperty('--d',Math.min(i,8)*0.06+'s'); el.classList.add('rv'); io.observe(el);
  });
  setTimeout(()=>document.querySelectorAll('#app .rv:not(.in)').forEach(el=>{const r=el.getBoundingClientRect(); if(r.top<innerHeight) el.classList.add('in');}),1200);
}
function countUp(el){
  const v = el.querySelector(':scope > .v'); if(!v || REDUCED || v.dataset.cu) return;
  const m = v.textContent.match(/^([^0-9]*)([0-9][0-9,]*\.?[0-9]*)(.*)$/); if(!m) return;
  const target = parseFloat(m[2].replace(/,/g,'')); if(!isFinite(target) || target===0) return;
  const dec = (m[2].split('.')[1]||'').length, comma = m[2].includes(','), final = v.textContent;
  v.dataset.cu = 1; const t0 = performance.now(), dur = 900;
  const fmt = n => { let s = n.toFixed(dec); if(comma){ const [i,d]=s.split('.'); s = i.replace(/\B(?=(\d{3})+(?!\d))/g,',') + (d?'.'+d:''); } return m[1]+s+m[3]; };
  const step = now => { const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3); v.textContent = k<1 ? fmt(target*e) : final; if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function animateBars(){
  reveal();
  const bars = document.querySelectorAll('[data-w]');
  requestAnimationFrame(()=>requestAnimationFrame(()=>bars.forEach(b=>b.style.width=b.dataset.w+'%')));
}
document.addEventListener('click', e=>{
  const c = e.target.closest('[data-card]'); if(c){ openCard(c.dataset.card); return; }
  if(e.target.closest('[data-close]') || e.target.id==='modal'){ closeCard(); return; }
  const bb = e.target.closest('[data-budget]'); if(bb){ budgetPick = bb.dataset.budget; render(true); return; }
  const q = e.target.closest('[data-q]'); if(q){ sc.a[q.dataset.q] = +q.dataset.v; render(true); return; }
  const scb = e.target.closest('[data-scb]'); if(scb){ sc.b = scb.dataset.scb; render(true); return; }
  if(e.target.closest('[data-screset]')){ sc.a = {}; render(true); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#modal').hidden) closeCard(); });
$('#menuBtn').addEventListener('click',()=>{const o=$('#links').classList.toggle('open');$('#menuBtn').setAttribute('aria-expanded',o)});
window.addEventListener('hashchange',()=>render());
document.addEventListener('toggle', e=>{ const d=e.target; if(!(d instanceof HTMLDetailsElement) || !d.classList.contains('dsec') || !d.open) return;
  document.querySelectorAll('details.dsec[open]').forEach(o=>{ if(o!==d) o.open=false; });
  d.querySelectorAll('.dp').forEach(el=>el.classList.remove('rv','in'));
  requestAnimationFrame(()=>{ const r=d.getBoundingClientRect(); if(r.top<70||r.top>innerHeight*0.6) window.scrollTo({top:scrollY+r.top-84,behavior:'smooth'}); });
}, true);
render();

</script>
